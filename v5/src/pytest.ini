[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
# 递归时必须跳过构建副本：_protect_stage.py 会把 test_*.py 连夹具一起拷进 _stage，
# 留着它就被 rootdir 递归收进来，同名模块（没有包 __init__）撞在一起，
# 报 "import file mismatch" 直接把整轮 collection 打断（踩过）。
# 与 _protect_stage.py 的 EXCLUDE_DIRS 保持一致，别一处加一处漏。
# _tmp_pytest_* 是排查脚本在树里落下的临时工作副本，里面同样有 test_*.py 的拷贝，
# 而且常带只读/受限 ACL（列目录都拒绝），收进来只会把 collection 整个打断。
norecursedirs = .git .pytest_cache __pycache__ _stage _testdata _testdata_real _tmp_rwork _tmp_pytest_* _diag_plots _diag_shots assets data dist build r_refs
